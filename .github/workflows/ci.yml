name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build Chrome extension
        run: pnpm build

      - name: Package Chrome extension
        run: pnpm zip

      - name: Verify extension artifacts
        run: pnpm verify:extension --summary

      - name: Upload Chrome ZIP and build report
        uses: actions/upload-artifact@v4
        with:
          name: bookmark-home-chrome
          path: |
            .output/bookmark-home-*-chrome.zip
            .output/build-report.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      - name: Publish build summary
        shell: bash
        run: |
          if [ -f .output/build-report.json ]; then
            node -e "const r=require('./.output/build-report.json'); console.log('### Build report'); console.log(''); console.log('- Version: `'+r.version+'`'); console.log('- SHA-256: `'+r.sha256+'`'); console.log('- Bytes: `'+r.zipBytes+'`'); console.log('- Result: '+(r.ok?'PASS':'FAIL'));" >> "$GITHUB_STEP_SUMMARY"
          fi
